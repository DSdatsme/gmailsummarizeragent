name: Gmail Summarizer

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM IST
    - cron: "30 14 * * *"  # 8:00 PM IST
  workflow_dispatch:         # manual trigger

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          # config (non-sensitive)
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          MODEL: ${{ vars.MODEL }}
          GMAIL_ACCOUNTS: ${{ vars.GMAIL_ACCOUNTS }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS }}
          KEY_SENDERS: ${{ vars.KEY_SENDERS }}
          EXCLUDED_TOPICS: ${{ vars.EXCLUDED_TOPICS }}
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          # secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_ACCOUNT_1_REFRESH_TOKEN: ${{ secrets.GMAIL_ACCOUNT_1_REFRESH_TOKEN }}
          GMAIL_ACCOUNT_2_REFRESH_TOKEN: ${{ secrets.GMAIL_ACCOUNT_2_REFRESH_TOKEN }}
          GMAIL_ACCOUNT_3_REFRESH_TOKEN: ${{ secrets.GMAIL_ACCOUNT_3_REFRESH_TOKEN }}
          GMAIL_ACCOUNT_4_REFRESH_TOKEN: ${{ secrets.GMAIL_ACCOUNT_4_REFRESH_TOKEN }}
          GMAIL_ACCOUNT_5_REFRESH_TOKEN: ${{ secrets.GMAIL_ACCOUNT_5_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
